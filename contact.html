<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- @include head -->
  <title>تواصل — إسبرسو كوفي | Espresso Coffee</title>
  <meta name="description" content="تواصل مع إسبرسو كوفي في الحديدة — واتساب، إنستغرام @espre__sso، مواعيد العمل والاتجاهات إلى الفروع الثلاثة." />
  <meta property="og:title" content="تواصل — إسبرسو كوفي" />
  <meta property="og:image" content="/img/ig/interior-night-320.jpg" />
</head>
<body data-page="contact">
  <!-- @include header -->
  <main id="main">
    <section class="hero hero--short">
      <div class="hero__media" data-hero-media></div>
      <div class="hero__shade"></div>
      <div class="container hero__content">
        <p class="kicker" data-ar="تواصل" data-en="Contact">تواصل</p>
        <h1 class="hero__title" data-hero-title></h1>
        <p class="hero__lede" data-ar="طلب، حجز، شراكة، أو مجرد سلام — رسالة واحدة تكفي." data-en="An order, a booking, a partnership, or just a hello — one message is enough.">رسالة واحدة تكفي.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="grid grid--3">
          <a class="glass glass--hover pillar reveal" data-link="wa" style="--d:0">
            <span class="pillar__icon" data-icon="whatsapp"></span>
            <h3 data-label data-i18n="cta.whatsapp">اطلب عبر واتساب</h3>
            <p data-ar="أسرع طريقة للطلب أو الاستفسار." data-en="The fastest way to order or ask.">أسرع طريقة للطلب أو الاستفسار.</p>
          </a>
          <a class="glass glass--hover pillar reveal" data-link="ig" style="--d:1">
            <span class="pillar__icon" data-icon="instagram"></span>
            <h3>@espre__sso</h3>
            <p data-ar="تابع الجديد، الريلز، والعروض." data-en="Follow the latest, reels and offers.">تابع الجديد، الريلز، والعروض.</p>
          </a>
          <a class="glass glass--hover pillar reveal" data-link="maps" style="--d:2">
            <span class="pillar__icon" data-icon="pin"></span>
            <h3 data-i18n="cta.directions">الاتجاهات</h3>
            <p data-ar="الحديدة — المطراق، جامعة العلوم، حديدة لاند." data-en="Al Hudaydah — Al-Matraq, University of Science, Hodeidah Land.">الحديدة — ثلاثة فروع.</p>
          </a>
        </div>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <div class="split">
          <article class="glass pillar reveal">
            <span class="pillar__icon" data-icon="clock"></span>
            <h3 data-i18n="misc.hours">مواعيد العمل</h3>
            <p style="display:flex;align-items:center;gap:.5rem" data-status><span class="status__dot"></span><span data-status-text></span></p>
            <ul class="hours" style="margin-top:1rem" data-hours></ul>
            <p style="margin-top:1rem;font-size:var(--fs-xs);color:var(--c-ash)" data-i18n="misc.indicative">المواعيد تقريبية.</p>
          </article>
          <div class="reveal">
            <p class="kicker" data-ar="الفروع" data-en="Branches">الفروع</p>
            <h2 class="title" style="font-size:var(--fs-xl)" data-ar="أين تجدنا" data-en="Where to find us">أين تجدنا</h2>
            <ul class="grid" style="--gap:.8rem;margin-top:1.5rem" data-branches-compact></ul>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="band reveal" data-band="ig/peach-iced-tea">
          <h2 data-ar="خطتك لمواجهة الحر؟" data-en="Your plan against the heat?">خطتك لمواجهة الحر؟</h2>
          <p data-ar="خطتنا واضحة 🤎 — آيس تي خوخ يعدّل مزاجك." data-en="Ours is clear 🤎 — peach iced tea fixes your mood.">خطتنا واضحة 🤎</p>
          <div class="hero__ctas"><a href="/menu.html" class="btn btn--gold btn--lg"><span data-i18n="cta.menu">اكتشف القائمة</span><span class="arrow" data-icon="arrow"></span></a></div>
        </div>
      </div>
    </section>
  </main>
  <!-- @include footer -->
</body>
</html>
